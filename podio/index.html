  --bg1: #1a1036; --bg2: #3b0d18; --acento: #d62828; --ouro: #ffd23f; --prata: #d7dbe6; --bronze: #e08a4a;
  --texto: #fff; --suave: #b9b3d6; --card: rgba(18, 14, 40, .78); --borda: rgba(255, 255, 255, .12);
}
body.frio { --bg1: #0b2340; --bg2: #123c63; --acento: #4fb3ff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0d0d1a; color: var(--texto); font-family: 'Press Start 2P', monospace; cursor: none; }
/* palco fixo 1920x1080, escalado para qualquer TV (sempre cabe inteiro) */
#palco { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0;
  background: radial-gradient(ellipse at 50% 115%, var(--bg2), var(--bg1) 62%); transition: background 1.2s; overflow: hidden; }
#palco::before { content: ''; position: absolute; inset: 0; opacity: .07;
  background: repeating-linear-gradient(90deg, #fff 0 60px, transparent 60px 120px); transform: perspective(500px) rotateX(62deg) translateY(330px) scale(2.4); }
.neve { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
body.frio .neve { opacity: 1; }
.floco { position: absolute; top: -20px; width: 8px; height: 8px; background: #fff; opacity: .6; animation: cair linear infinite; }
@keyframes cair { to { transform: translateY(1120px); } }

header { position: absolute; top: 48px; left: 0; right: 0; text-align: center; }
.logo { font-size: 72px; color: var(--ouro); text-shadow: 6px 6px 0 #8e1414, 10px 10px 0 rgba(0, 0, 0, .35); letter-spacing: 2px; }
.sub { margin-top: 22px; font-size: 26px; color: var(--suave); }
.pista { display: inline-block; margin-top: 26px; padding: 16px 34px; font-size: 32px; background: var(--acento); box-shadow: 0 6px 0 rgba(0, 0, 0, .35); transition: background 1.2s; }

/* pódio */
#podio { position: absolute; left: 90px; bottom: 120px; width: 1080px; height: 640px; display: flex; align-items: flex-end; justify-content: center; gap: 26px; }
.lugar { width: 330px; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); }
.mostrar .lugar { animation: subir .7s cubic-bezier(.2, 1.4, .4, 1) forwards; }
.mostrar .l2 { animation-delay: .25s; } .mostrar .l3 { animation-delay: .5s; } .mostrar .l1 { animation-delay: .8s; }
@keyframes subir { to { opacity: 1; transform: none; } }
.piloto { width: 210px; height: 189px; image-rendering: pixelated; filter: drop-shadow(0 10px 0 rgba(0, 0, 0, .35)); }
.l1 .piloto { width: 250px; height: 225px; animation: pulo 1.6s ease-in-out infinite 1.6s; }
@keyframes pulo { 50% { transform: translateY(-14px); } }
.vazio .piloto { opacity: .15; filter: grayscale(1); }
.nome { margin-top: 16px; font-size: 26px; text-align: center; line-height: 1.35; max-width: 340px; overflow-wrap: anywhere; }
.setor { margin-top: 8px; font-size: 18px; color: var(--suave); min-height: 18px; }
.tempo { margin-top: 12px; font-size: 26px; color: var(--ouro); }
.bloco { margin-top: 18px; width: 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 22px; font-size: 92px; color: rgba(0, 0, 0, .45); box-shadow: inset 0 10px 0 rgba(255, 255, 255, .25), 0 10px 0 rgba(0, 0, 0, .3); }
.l1 .bloco { height: 230px; background: var(--ouro); }
.l2 .bloco { height: 160px; background: var(--prata); }
.l3 .bloco { height: 110px; background: var(--bronze); }
.l1 .nome { font-size: 32px; }

/* 4º ao 10º */
#lista { position: absolute; right: 90px; top: 300px; width: 640px; background: var(--card); border: 4px solid var(--borda); padding: 20px 30px 14px; }
#lista h2 { font-size: 20px; color: var(--suave); margin-bottom: 10px; font-weight: normal; }
.linha { display: grid; grid-template-columns: 70px 1fr auto; gap: 16px; align-items: center; padding: 10px 0; border-top: 2px dashed var(--borda); font-size: 19px; opacity: 0; }
.mostrar .linha { animation: entrar .5s ease-out forwards; }
@keyframes entrar { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.linha .pos { color: var(--suave); }
.linha .quem { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.linha .quem small { display: block; margin-top: 6px; font-size: 13px; color: var(--suave); }
.linha .t { color: var(--ouro); }
.linha.vaga { color: rgba(255, 255, 255, .3); }

/* chamada para jogar */
#jogue { position: absolute; right: 90px; bottom: 76px; width: 640px; display: flex; gap: 24px; align-items: center; background: var(--card); border: 4px solid var(--borda); padding: 16px 20px; }
#jogue img { width: 138px; height: 138px; image-rendering: pixelated; background: #fff; padding: 6px; }
#jogue b { display: block; font-size: 22px; color: var(--ouro); line-height: 1.5; font-weight: normal; }
#jogue span { display: block; margin-top: 14px; font-size: 15px; color: var(--suave); line-height: 1.7; }

#vazio { position: absolute; left: 90px; width: 1080px; top: 296px; text-align: center; font-size: 26px; color: var(--ouro); line-height: 1.7; display: none; animation: piscar 1.4s steps(2) infinite; }
@keyframes piscar { 50% { opacity: .55; } }
.semdados #vazio { display: block; }

footer { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 15px; color: var(--suave); }
#selo.velho { color: #ff8a80; }
#barra { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--acento); width: 0; }
#dots { position: absolute; top: 60px; right: 90px; display: flex; gap: 14px; }
#dots i { width: 18px; height: 18px; background: rgba(255, 255, 255, .25); }
#dots i.on { background: var(--ouro); }
</style>
</head>
<body>
<div id="palco">
  <div class="neve" id="neve"></div>
  <div id="dots"><i></i><i></i></div>
  <header>
    <div class="logo">BARATÃO KART</div>
    <div class="sub">PÓDIO DOS COLABORADORES · MELHOR TEMPO DE 3 VOLTAS</div>
    <div class="pista" id="pista">Pista do Hortifruti</div>
  </header>
  <div id="podio"></div>
  <div id="vazio">O PÓDIO ESTÁ ESPERANDO VOCÊ!</div>
  <div id="lista"><h2>4º AO 10º LUGAR</h2><div id="linhas"></div></div>
  <div id="jogue">
    <img src="qrcode.png" alt="QR code do jogo">
    <div><b>APONTE A CÂMERA<br>E ENTRE NA DISPUTA!</b><span>diegocarv3-design.github.io<br>/baratao-kart</span></div>
  </div>
  <footer id="selo">Carregando o ranking...</footer>
  <div id="barra"></div>
</div>
<script>
// Pódio para a TV da loja: lê o ranking do jogo (só leitura) e alterna entre as pistas.
const SUPABASE = { url: 'https://xrnnkgcskgijjkkoygnz.supabase.co', anonKey: 'sb_publishable_QSXnL3Ap0UvJxaMbkUJnTw_G_aBTzTt' }; // chave pública (anon); o banco só permite ler e inserir
const PISTAS = [{ id: 'horti', nome: 'Pista do Hortifruti' }, { id: 'frio', nome: 'Câmara Fria ❄' }];
const SPRITE = { 'Boi Turbo': 'boi', 'Cenoura Veloz': 'cenoura', 'Tomatão': 'tomate', 'Dona Penosa': 'penosa' };
const TROCA = 20, ATUALIZA = 60; // segundos: troca de pista e nova leitura do ranking
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + s.toFixed(2).padStart(5, '0'); };
const hora = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

const dados = { horti: [], frio: [] };
let lidoEm = null, falhou = false, atual = 0;

async function ler() {
  try {
    for (const p of PISTAS) {
      const r = await fetch(`${SUPABASE.url}/rest/v1/kart_ranking?select=nome,setor,piloto,tempo&pista=eq.${p.id}&order=tempo.asc&limit=300`,
        { headers: { apikey: SUPABASE.anonKey, Authorization: 'Bearer ' + SUPABASE.anonKey }, cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      // cada pessoa aparece uma vez, com o melhor tempo (mesma regra do jogo)
      const vistos = new Set(), melhores = [];
      for (const e of await r.json()) { const k = (e.nome + '|' + (e.setor || '')).toLowerCase(); if (!vistos.has(k)) { vistos.add(k); melhores.push(e); } }
      dados[p.id] = melhores.slice(0, 10);
    }
    lidoEm = new Date(); falhou = false;
  } catch (e) { falhou = true; }
  selo();
}

function selo() {
  const s = $('#selo');
  if (!lidoEm) { s.textContent = falhou ? 'Sem conexão com o ranking. Tentando de novo...' : 'Carregando o ranking...'; s.classList.toggle('velho', falhou); return; }
  s.textContent = falhou ? `Sem conexão · mostrando o ranking de ${hora(lidoEm)}` : `Ranking atualizado às ${hora(lidoEm)} · atualiza a cada minuto`;
  s.classList.toggle('velho', falhou);
}

function lugar(e, n) {
  const img = SPRITE[e?.piloto] || ['boi', 'cenoura', 'tomate'][n - 1];
  return `<div class="lugar l${n}${e ? '' : ' vazio'}">
    <img class="piloto" src="${img}.png" alt="">
    <div class="nome">${e ? esc(e.nome) : '???'}</div>
    <div class="setor">${e ? esc(e.setor || '') : 'lugar livre'}</div>
    <div class="tempo">${e ? fmt(+e.tempo) : '--:--.--'}</div>
    <div class="bloco">${n}</div></div>`;
}

function mostrar() {
  const p = PISTAS[atual], rows = dados[p.id];
  document.body.classList.toggle('frio', p.id === 'frio');
  $('#pista').textContent = p.nome;
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === atual));
  $('#palco').classList.toggle('semdados', !rows.length);
  const podio = $('#podio'); podio.classList.remove('mostrar');
  podio.innerHTML = lugar(rows[1], 2) + lugar(rows[0], 1) + lugar(rows[2], 3);
  let h = '';
  for (let i = 3; i < 10; i++) {
    const e = rows[i];
    h += e ? `<div class="linha" style="animation-delay:${1 + (i - 3) * .12}s"><span class="pos">${i + 1}º</span><span class="quem">${esc(e.nome)}<small>${esc(e.setor || '')} · ${esc(e.piloto || '')}</small></span><span class="t">${fmt(+e.tempo)}</span></div>`
           : `<div class="linha vaga" style="animation-delay:${1 + (i - 3) * .12}s"><span class="pos">${i + 1}º</span><span class="quem">lugar livre</span><span class="t">--:--.--</span></div>`;
  }
  $('#linhas').innerHTML = h;
  void podio.offsetWidth; podio.classList.add('mostrar'); $('#lista').classList.remove('mostrar'); void $('#lista').offsetWidth; $('#lista').classList.add('mostrar');
  const b = $('#barra'); b.style.transition = 'none'; b.style.width = '0'; void b.offsetWidth; b.style.transition = `width ${TROCA}s linear`; b.style.width = '100%';
}

function encaixar() { // escala o palco para caber na tela, sem cortar
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#palco').style.transform = `scale(${k}) translate(-50%, -50%)`;
}

for (let i = 0; i < 40; i++) {
  const f = document.createElement('i'); f.className = 'floco';
  f.style.left = Math.random() * 100 + '%'; f.style.animationDuration = 6 + Math.random() * 8 + 's'; f.style.animationDelay = -Math.random() * 14 + 's';
  $('#neve').appendChild(f);
}
addEventListener('resize', encaixar); encaixar();
// controle: setas trocam de pista; clique ou F = tela cheia
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { atual = (atual + 1) % PISTAS.length; mostrar(); reiniciaTroca(); }
  if (e.key === 'f' || e.key === 'F') telaCheia();
});
addEventListener('click', telaCheia);
function telaCheia() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); }
let troca;
function reiniciaTroca() { clearInterval(troca); troca = setInterval(() => { atual = (atual + 1) % PISTAS.length; mostrar(); }, TROCA * 1000); }

ler().then(() => { mostrar(); reiniciaTroca(); });
setInterval(ler, ATUALIZA * 1000);
setInterval(selo, 30000);
// recarrega a página uma vez por dia (madrugada) para pegar melhorias sem ninguém mexer na TV
setInterval(() => { if (new Date().getHours() === 4 && performance.now() > 3600e3) location.reload(); }, 600e3);
</script>
</body>
</html>
